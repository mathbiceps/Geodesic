<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geodesic — Spherical Path Game</title>
    <!-- Tailwind CSS for clean, responsive UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D WebGL Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Inter & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #070709;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f4f4f6;
            touch-action: none; /* Prevent browser scroll/zoom on mobile */
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Floating 3D-projected City Labels */
        .city-label {
            position: absolute;
            transform: translate(-50%, -140%);
            pointer-events: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: rgba(12, 12, 15, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            white-space: nowrap;
            transition: opacity 0.2s ease, transform 0.1s linear;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .city-label::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
        }

        .city-label.active-start {
            border-color: #3b82f6;
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.45);
        }

        .city-label.active-start::after {
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 3D Globe Container -->
    <div id="canvas-container"></div>

    <!-- Floating City Name Overlays (Only A and B shown) -->
    <div id="label-a" class="city-label hidden"></div>
    <div id="label-b" class="city-label hidden"></div>

    <!-- Top UI: Minimalist Reset / Try Again Trigger (Shown during active gameplay) -->
    <div id="top-controls" class="fixed top-6 left-0 right-0 z-20 flex justify-center pointer-events-none hidden">
        <button id="btn-try-again" 
                class="pointer-events-auto px-4 py-2 rounded-full text-xs font-medium tracking-wider uppercase text-zinc-300 bg-zinc-900/75 hover:bg-zinc-800/90 hover:text-white border border-zinc-700/60 backdrop-blur-md transition-all duration-200 shadow-lg active:scale-95 flex items-center gap-2">
            <span>Try Again</span>
            <span class="hidden sm:inline-block text-[10px] text-zinc-500 mono border border-zinc-700/80 px-1.5 py-0.5 rounded">ESC</span>
        </button>
    </div>

    <!-- Center Start Overlay -->
    <div id="start-overlay" class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-black/55 backdrop-blur-sm transition-opacity duration-500">
        <div class="text-center px-6 max-w-md fade-in">
            <h1 class="text-3xl sm:text-4xl font-light tracking-[0.22em] uppercase text-white mb-3">
                Geodesic
            </h1>
            <p class="text-xs sm:text-sm text-zinc-400 font-light tracking-wide mb-8 leading-relaxed">
                Trace the shortest path between 2 cities.
            </p>
            <button id="btn-play" 
                    class="px-9 py-3.5 rounded-full bg-white text-black text-xs sm:text-sm font-semibold tracking-[0.18em] uppercase hover:bg-zinc-200 transition-all duration-200 shadow-[0_0_30px_rgba(255,255,255,0.25)] active:scale-95 cursor-pointer">
                Play
            </button>
            <div id="global-counter-wrap" class="mt-6 text-[11px] text-zinc-500 tracking-wider font-light">
                <span id="global-games-count" class="text-zinc-300 mono">0</span> <span id="global-games-label">games played worldwide</span>
            </div>
        </div>
    </div>

    <!-- Bottom Result Overlay (Score + Optimal Path Comparison + Play Again) -->
    <div id="result-overlay" class="fixed bottom-7 left-0 right-0 z-20 flex flex-col items-center justify-end pointer-events-none hidden px-4">
        <div class="pointer-events-auto bg-zinc-950/85 border border-zinc-800/90 backdrop-blur-xl rounded-2xl px-6 py-4 shadow-2xl flex flex-col items-center gap-3 fade-in max-w-xs w-full">
            
            <!-- Accuracy Score -->
            <div class="flex flex-col items-center">
                <span class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-medium">Accuracy</span>
                <div id="score-value" class="text-3xl sm:text-4xl font-light text-white mono tracking-tight mt-0.5">
                    0.0%
                </div>
            </div>

            <!-- Legend / Distance Metric -->
            <div class="w-full flex items-center justify-between text-[11px] text-zinc-400 border-t border-zinc-800/80 pt-2.5 px-1">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-blue-500 inline-block shadow-[0_0_6px_#3b82f6]"></span>
                    <span>Yours: <strong id="user-dist" class="text-zinc-200 font-normal mono">0 km</strong></span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-white inline-block shadow-[0_0_6px_#ffffff]"></span>
                    <span>Shortest: <strong id="opt-dist" class="text-zinc-200 font-normal mono">0 km</strong></span>
                </div>
            </div>

            <!-- Small Play Again Button -->
            <button id="btn-play-again" 
                    class="mt-1 w-full py-2.5 px-5 rounded-xl bg-white hover:bg-zinc-200 text-black text-xs font-semibold tracking-[0.15em] uppercase transition-all duration-150 active:scale-95 shadow-md cursor-pointer">
                Play Again
            </button>
        </div>
    </div>

        // ==========================================
        // 4. PROCEDURAL MONOCHROME EARTH TEXTURE
        // ==========================================
        function createMonochromeEarthTexture() {
            const width = 2048;
            const height = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0c0d10';
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.045)';
            ctx.lineWidth = 1;

            for (let lon = -180; lon <= 180; lon += 15) {
                const x = ((lon + 180) / 360) * width;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let lat = -90; lat <= 90; lat += 15) {
                const y = ((90 - lat) / 180) * height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(width / 2, height);
            ctx.stroke();

            ctx.fillStyle = '#202228';
            ctx.strokeStyle = '#525663';
            ctx.lineWidth = 1.6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            CONTINENT_POLYGONS.forEach(poly => {
                ctx.beginPath();
                poly.forEach(([lat, lon], idx) => {
                    const x = ((lon + 180) / 360) * width;
                    const y = ((90 - lat) / 180) * height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            ctx.strokeStyle = 'rgba(130, 136, 150, 0.42)';
            ctx.lineWidth = 1.1;
            COUNTRY_BORDERS.forEach(border => {
                ctx.beginPath();
                border.forEach(([lat, lon], idx) => {
                    const x = ((lon + 180) / 360) * width;
                    const y = ((90 - lat) / 180) * height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
            CITIES.forEach(city => {
                const x = ((city.lon + 180) / 360) * width;
                const y = ((90 - city.lat) / 180) * height;
                ctx.beginPath();
                ctx.arc(x, y, 1.8, 0, Math.PI * 2);
                ctx.fill();
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 8;
            return texture;
        }

        // ==========================================
        // 5. THREE.JS SCENE, GLOBE & PATH MESHES
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070709);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        const INITIAL_CAMERA_PHI = THREE.MathUtils.degToRad(72);

        function updateCameraDistance() {
            const aspect = window.innerWidth / window.innerHeight;
            const baseDist = aspect < 1 ? 33 / Math.max(aspect, 0.55) : 27;
            const r = Math.min(Math.max(baseDist, 26), 54);
            camera.position.set(
                0,
                r * Math.cos(INITIAL_CAMERA_PHI),
                r * Math.sin(INITIAL_CAMERA_PHI)
            );
            camera.lookAt(0, 0, 0);
        }
        updateCameraDistance();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
        dirLight.position.set(15, 20, 25);
        scene.add(dirLight);

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
        const earthMat = new THREE.MeshStandardMaterial({
            map: createMonochromeEarthTexture(),
            roughness: 0.85,
            metalness: 0.1
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earthMesh);

        const atmoGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.022, 64, 64);
        const atmoMat = new THREE.MeshBasicMaterial({

        function createCityMarker() {
            const group = new THREE.Group();

            const dotGeo = new THREE.SphereGeometry(0.16, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            group.add(dot);

            const ringMat = new THREE.MeshBasicMaterial({

                opacity: 0.85
            });

            group.userData = { dot, ring };
            group.visible = false;

        const markerA = createCityMarker();
        const markerB = createCityMarker();

        let userPathMesh = null;
        let optimalPathMesh = null;

        function clearPaths() {
            if (userPathMesh) {
                earthGroup.remove(userPathMesh);
                userPathMesh.geometry.dispose();
                userPathMesh = null;
            }
            if (optimalPathMesh) {
                earthGroup.remove(optimalPathMesh);
                optimalPathMesh.geometry.dispose();
                optimalPathMesh = null;
            }
        }

        function updateUserPathMesh() {
            if (userPathMesh) {
                earthGroup.remove(userPathMesh);
                userPathMesh.geometry.dispose();
                userPathMesh = null;
            }
            if (state.pathPoints.length < 2) return;

            const liftedPoints = state.pathPoints.map(p => p.clone().normalize().multiplyScalar(EARTH_RADIUS + 0.06));
            const curve = new THREE.CatmullRomCurve3(liftedPoints);
            const tubularSegments = Math.min(280, Math.max(24, liftedPoints.length * 3));
            const tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, 0.075, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
            userPathMesh = new THREE.Mesh(tubeGeo, tubeMat);
            earthGroup.add(userPathMesh);
        }

        function buildOptimalArcPoints(p1, p2) {
            const v1 = p1.clone().normalize();
            const v2 = p2.clone().normalize();
            const omega = Math.acos(THREE.MathUtils.clamp(v1.dot(v2), -1, 1));
            const sinOmega = Math.sin(omega);

            const segments = 96;
            const arcPoints = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                let dir;
                if (sinOmega < 0.0001) {
                    dir = v1.clone().lerp(v2, t).normalize();
                } else {
                    const a = Math.sin((1 - t) * omega) / sinOmega;
                    const b = Math.sin(t * omega) / sinOmega;
                    dir = v1.clone().multiplyScalar(a).add(v2.clone().multiplyScalar(b)).normalize();
                }
                arcPoints.push(dir.multiplyScalar(EARTH_RADIUS + 0.08));
            }
            return arcPoints;
        }

        function updateAnimatedOptimalPath(progress) {
            if (optimalPathMesh) {
                earthGroup.remove(optimalPathMesh);
                optimalPathMesh.geometry.dispose();
                optimalPathMesh = null;
            }

            const fullPoints = state.optimalArcPoints;
            if (!fullPoints || fullPoints.length < 2) return;

            const clampedProgress = THREE.MathUtils.clamp(progress, 0, 1);
            if (clampedProgress <= 0.01) return;

            const totalSegs = fullPoints.length - 1;
            const exactIdx = clampedProgress * totalSegs;
            const wholeIdx = Math.floor(exactIdx);
            const frac = exactIdx - wholeIdx;

            const visiblePoints = fullPoints.slice(0, wholeIdx + 1);
            if (wholeIdx < totalSegs && frac > 0.001) {
                const interp = fullPoints[wholeIdx].clone().lerp(fullPoints[wholeIdx + 1], frac);
                visiblePoints.push(interp);
            }

            if (visiblePoints.length < 2) return;

            const curve = new THREE.CatmullRomCurve3(visiblePoints);
            const tubularSegments = Math.max(8, Math.round(96 * clampedProgress));
            const tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, 0.06, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.92
            });
            optimalPathMesh = new THREE.Mesh(tubeGeo, tubeMat);
            earthGroup.add(optimalPathMesh);
        }

        // ==========================================
        // 6. COORDINATE & GEODESIC MATH HELPERS
        // ==========================================
        function latLonToVector3(lat, lon, radius = EARTH_RADIUS) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        function angularDistance(v1, v2) {
            const n1 = v1.clone().normalize();
            const n2 = v2.clone().normalize();
            return Math.acos(THREE.MathUtils.clamp(n1.dot(n2), -1, 1));
        }

        function computePathDistanceKm(points) {
            let totalRad = 0;
            for (let i = 1; i < points.length; i++) {
                totalRad += angularDistance(points[i - 1], points[i]);
            }
            return totalRad * REAL_EARTH_RADIUS_KM;
        }

        function orientMarkerOnSurface(marker, localPos) {
            marker.position.copy(localPos);
            const normal = localPos.clone().normalize();
            marker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
        }

        function focusCameraOnCities(posA, posB) {
            const mid = posA.clone().add(posB).normalize();
            const yaw = Math.atan2(-mid.x, mid.z);
            const horizontalDist = Math.sqrt(mid.x * mid.x + mid.z * mid.z);
            const camElevation = (Math.PI / 2) - INITIAL_CAMERA_PHI;
            const pitch = Math.atan2(mid.y, horizontalDist) - camElevation;

            earthGroup.rotation.set(0, 0, 0);
            earthGroup.rotateY(yaw);
            const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            earthGroup.quaternion.premultiply(qPitch);

            // Offset off the great-circle plane so the geodesic arc visibly curves on screen
            const vAWorld = posA.clone().applyQuaternion(earthGroup.quaternion).normalize();
            const vBWorld = posB.clone().applyQuaternion(earthGroup.quaternion).normalize();
            const chordDir = vBWorld.clone().sub(vAWorld);
            chordDir.z = 0;
            if (chordDir.lengthSq() > 0.0001) {
                chordDir.normalize();
                const tiltSign = (Math.random() < 0.5 ? 1 : -1);
                const obliqueTilt = THREE.MathUtils.degToRad(24) * tiltSign;
                const qOblique = new THREE.Quaternion().setFromAxisAngle(chordDir, obliqueTilt);
                earthGroup.quaternion.premultiply(qOblique);
            }
        }

        // Project 3D city surface coordinate to 2D screen space and hide when occluded behind the globe
        function updateCityLabelPosition(localPos, labelEl) {
            if (!localPos || !labelEl) return;

            const worldPos = localPos.clone().applyMatrix4(earthGroup.matrixWorld);
            const surfaceNormal = worldPos.clone().normalize();
            const toCamera = camera.position.clone().sub(worldPos).normalize();

            // Occlusion check: hide label if city is on the far side of the sphere
            if (surfaceNormal.dot(toCamera) < 0.05) {
                labelEl.style.opacity = '0';
                return;
            }

            const projected = worldPos.clone().project(camera);
            const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;

            labelEl.style.left = `${x}px`;
            labelEl.style.top = `${y}px`;
            labelEl.style.opacity = '1';
        }

        // ==========================================
        // 7. GAME FLOW & ROUND MANAGEMENT
        // ==========================================
        const labelAEl = document.getElementById('label-a');
        const labelBEl = document.getElementById('label-b');
        const startOverlay = document.getElementById('start-overlay');
        const topControls = document.getElementById('top-controls');
        const resultOverlay = document.getElementById('result-overlay');
        const hintBar = document.getElementById('hint-bar');

        function pickTwoRandomCities() {
            const idxA = Math.floor(Math.random() * CITIES.length);
            const cityA = CITIES[idxA];
            let idxB = Math.floor(Math.random() * CITIES.length);

            // 80% chance to pick a destination within a similar latitude band (±30%)
            const enforceSimilarLatitude = Math.random() < 0.80;
            const latTolerance = Math.max(12, Math.abs(cityA.lat) * 0.30);

            let attempts = 0;
            while (attempts < 250) {
                idxB = Math.floor(Math.random() * CITIES.length);
                if (idxA !== idxB) {
                    const candidateB = CITIES[idxB];
                    const latDiff = Math.abs(candidateB.lat - cityA.lat);
                    if (!enforceSimilarLatitude || latDiff <= latTolerance) {
                        const pA = latLonToVector3(cityA.lat, cityA.lon);
                        const pB = latLonToVector3(candidateB.lat, candidateB.lon);
                        const distKm = angularDistance(pA, pB) * REAL_EARTH_RADIUS_KM;
                        if (distKm > 1800 && distKm < 16500) break;
                    }
                }
                attempts++;
            }

            if (attempts >= 250) {
                let fallbackAttempts = 0;
                while (fallbackAttempts < 100) {
                    idxB = Math.floor(Math.random() * CITIES.length);
                    if (idxA !== idxB) {
                        const pA = latLonToVector3(cityA.lat, cityA.lon);
                        const pB = latLonToVector3(CITIES[idxB].lat, CITIES[idxB].lon);
                        const distKm = angularDistance(pA, pB) * REAL_EARTH_RADIUS_KM;
                        if (distKm > 1800 && distKm < 16500) break;
                    }
                    fallbackAttempts++;
                }
            }

            return [cityA, CITIES[idxB]];
        }

        function startNewRound() {
            incrementGlobalGamesCount();
            const [cA, cB] = pickTwoRandomCities();
            state.cityA = cA;
            state.cityB = cB;
            state.posA = latLonToVector3(cA.lat, cA.lon, EARTH_RADIUS);
            state.posB = latLonToVector3(cB.lat, cB.lon, EARTH_RADIUS);

            resetCurrentAttempt(true);
        }

        function resetCurrentAttempt(reorientGlobe = false) {
            if (state.revealTimeout) {
                clearTimeout(state.revealTimeout);
                state.revealTimeout = null;
            }
            state.mode = 'PLAYING';
            state.isDrawing = false;
            state.drawPointerId = null;
            state.startCity = null;
            state.targetCity = null;
            state.pathPoints = [];
            state.optimalAnimStartTime = null;
            state.optimalArcPoints = [];
            state.rotVelocity = { x: 0, y: 0 };

            clearPaths();

            orientMarkerOnSurface(markerA, state.posA);
            orientMarkerOnSurface(markerB, state.posB);
            markerA.visible = true;
            markerB.visible = true;

            markerA.userData.dot.material.color.setHex(0xffffff);
            markerA.userData.ring.material.color.setHex(0xffffff);
            markerB.userData.dot.material.color.setHex(0xffffff);
            markerB.userData.ring.material.color.setHex(0xffffff);

            labelAEl.textContent = state.cityA.name;
            labelBEl.textContent = state.cityB.name;
            labelAEl.classList.remove('hidden', 'active-start');
            labelBEl.classList.remove('hidden', 'active-start');

            startOverlay.classList.add('hidden');
            resultOverlay.classList.add('hidden');
            topControls.classList.remove('hidden');
            hintBar.classList.remove('hidden');

            if (reorientGlobe) {
                focusCameraOnCities(state.posA, state.posB);
            }
        }

        function finishRound() {
            state.mode = 'REVEALING';
            state.isDrawing = false;
            state.drawPointerId = null;

            const endPos = state.targetCity === 'A' ? state.posA.clone() : state.posB.clone();
            state.pathPoints.push(endPos);
            updateUserPathMesh();

            const startArcPos = state.startCity === 'B' ? state.posB : state.posA;
            const endArcPos = state.startCity === 'B' ? state.posA : state.posB;
            state.optimalArcPoints = buildOptimalArcPoints(startArcPos, endArcPos);
            // Wait 400ms, then animate the shortest path over the remaining 1000ms (1.4s total reveal)
            state.optimalAnimStartTime = performance.now() + 400;

            const optimalKm = angularDistance(state.posA, state.posB) * REAL_EARTH_RADIUS_KM;
            const userKm = Math.max(optimalKm, computePathDistanceKm(state.pathPoints));

            const ratio = optimalKm / userKm;
            const rawScore = Math.pow(ratio, 1.35) * 100;
            const clampedScore = Math.max(0, Math.min(100, rawScore));

            document.getElementById('score-value').textContent = `${clampedScore.toFixed(1)}%`;
            document.getElementById('user-dist').textContent = `${Math.round(userKm).toLocaleString()} km`;
            document.getElementById('opt-dist').textContent = `${Math.round(optimalKm).toLocaleString()} km`;

            topControls.classList.add('hidden');
            hintBar.classList.add('hidden');

            state.revealTimeout = setTimeout(() => {
                updateAnimatedOptimalPath(1);
                state.mode = 'RESULT';
                resultOverlay.classList.remove('hidden');
                state.revealTimeout = null;
            }, 1400);
        }

        // ==========================================
        // 8. RAYCASTING & MULTI-POINTER INTERACTION
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();

        function getEarthHitLocal(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointerNDC, camera);
            const hits = raycaster.intersectObject(earthMesh, false);
            if (hits.length > 0) {
                return earthGroup.worldToLocal(hits[0].point.clone());
            }
            return null;
        }

        function rotateEarthByDelta(dx, dy) {
            const rotSpeed = 0.0045;
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * rotSpeed);
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * rotSpeed);
            earthGroup.quaternion.premultiply(qY);
            earthGroup.quaternion.premultiply(qX);
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (state.mode === 'MENU') return;

            const localHit = getEarthHitLocal(e.clientX, e.clientY);

            if (state.mode === 'PLAYING' && !state.isDrawing && localHit) {
                const distToA = angularDistance(localHit, state.posA);
                const distToB = angularDistance(localHit, state.posB);

                if (distToA <= CITY_HIT_ANGLE_THRESHOLD || distToB <= CITY_HIT_ANGLE_THRESHOLD) {
                    state.isDrawing = true;
                    state.drawPointerId = e.pointerId;

                    if (distToA <= distToB) {
                        state.startCity = 'A';
                        state.targetCity = 'B';
                        state.pathPoints = [state.posA.clone()];
                        markerA.userData.dot.material.color.setHex(0x3b82f6);
                        markerA.userData.ring.material.color.setHex(0x3b82f6);
                        labelAEl.classList.add('active-start');
                    } else {
                        state.startCity = 'B';
                        state.targetCity = 'A';
                        state.pathPoints = [state.posB.clone()];
                        markerB.userData.dot.material.color.setHex(0x3b82f6);
                        markerB.userData.ring.material.color.setHex(0x3b82f6);
                        labelBEl.classList.add('active-start');
                    }

                    updateUserPathMesh();
                    renderer.domElement.setPointerCapture(e.pointerId);
                    return;
                }
            }

            if (!state.isRotating) {
                state.isRotating = true;
                state.rotatePointerId = e.pointerId;
                state.lastRotatePos = { x: e.clientX, y: e.clientY };
                state.rotVelocity = { x: 0, y: 0 };
                renderer.domElement.setPointerCapture(e.pointerId);
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (state.isDrawing && e.pointerId === state.drawPointerId && state.mode === 'PLAYING') {
                const localHit = getEarthHitLocal(e.clientX, e.clientY);
                if (localHit) {
                    const lastPt = state.pathPoints[state.pathPoints.length - 1];
                    const stepAngle = angularDistance(lastPt, localHit);

                    if (stepAngle > 0.008 && stepAngle < 0.65) {
                        state.pathPoints.push(localHit);
                        updateUserPathMesh();
                    }

                    const targetPos = state.targetCity === 'A' ? state.posA : state.posB;
                    if (state.pathPoints.length > 3 && angularDistance(localHit, targetPos) <= CITY_HIT_ANGLE_THRESHOLD * 0.92) {
                        finishRound();
                    }
                }
                return;
            }

            if (state.isRotating && e.pointerId === state.rotatePointerId) {
                const dx = e.clientX - state.lastRotatePos.x;
                const dy = e.clientY - state.lastRotatePos.y;
                state.lastRotatePos = { x: e.clientX, y: e.clientY };

                rotateEarthByDelta(dx, dy);
                state.rotVelocity = { x: dx, y: dy };
            }
        });

        function handlePointerEnd(e) {
            if (state.isDrawing && e.pointerId === state.drawPointerId) {
                state.isDrawing = false;
                state.drawPointerId = null;

                if (state.mode === 'PLAYING') {
                    const lastPt = state.pathPoints[state.pathPoints.length - 1];
                    const targetPos = state.targetCity === 'A' ? state.posA : state.posB;
                    if (lastPt && state.pathPoints.length > 3 && angularDistance(lastPt, targetPos) <= CITY_HIT_ANGLE_THRESHOLD) {
                        finishRound();
                    }
                }
            }

            if (state.isRotating && e.pointerId === state.rotatePointerId) {
                state.isRotating = false;
                state.rotatePointerId = null;
            }
        }

        renderer.domElement.addEventListener('pointerup', handlePointerEnd);
        renderer.domElement.addEventListener('pointercancel', handlePointerEnd);

        // ==========================================
        // 9. KEYBOARD CONTROLS & UI BUTTON LISTENERS
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (e.key in state.keysPressed) {
                e.preventDefault();
                state.keysPressed[e.key] = true;
            }
            if (e.key === 'Escape') {
                if (state.mode === 'PLAYING') {
                    resetCurrentAttempt(false);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in state.keysPressed) {
                state.keysPressed[e.key] = false;
            }
        });

        document.getElementById('btn-play').addEventListener('click', () => {
            startNewRound();
        });

        document.getElementById('btn-try-again').addEventListener('click', () => {
            if (state.mode === 'PLAYING') {
                resetCurrentAttempt(false);
            }
        });

        document.getElementById('btn-play-again').addEventListener('click', () => {
            startNewRound();
        });

        // ==========================================
        // 10. GLOBAL INTERNET GAMES COUNTER (FIREBASE RTDB)
        // ==========================================
        const FIREBASE_PLAYS_URL = 'https://geodesic-counter-default-rtdb.firebaseio.com/plays.json';
        let localKnownCount = 0;

        function renderGlobalCounter(count) {
            if (typeof count !== 'number' || Number.isNaN(count)) return;
            localKnownCount = Math.max(localKnownCount, count);
            const countEl = document.getElementById('global-games-count');
            const labelEl = document.getElementById('global-games-label');
            if (countEl) {
                countEl.textContent = localKnownCount.toLocaleString();
            }
            if (labelEl) {
                labelEl.textContent = localKnownCount === 1 ? 'game played worldwide' : 'games played worldwide';
            }
        }

        async function fetchGlobalGamesCount() {
            try {
                const res = await fetch(FIREBASE_PLAYS_URL, { cache: 'no-store' });
                if (!res.ok) return;
                const val = await res.json();
                if (typeof val === 'number' && !Number.isNaN(val)) {
                    renderGlobalCounter(val);
                }
            } catch (err) {
                // Fail silently if offline
            }
        }

        async function incrementGlobalGamesCount() {
            // Optimistically update UI immediately
            renderGlobalCounter(localKnownCount + 1);
            try {
                // Use Firebase REST atomic ServerValue increment so concurrent players never overwrite each other
                const res = await fetch(FIREBASE_PLAYS_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ '.sv': { increment: 1 } })
                });
                if (!res.ok) return;
                const updatedVal = await res.json();
                if (typeof updatedVal === 'number' && !Number.isNaN(updatedVal)) {
                    renderGlobalCounter(updatedVal);
                }
            } catch (err) {
                // Fail silently if offline
            }
        }

        // ==========================================
        // 11. RENDER & ANIMATION LOOP
        // ==========================================
        function handleWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            updateCameraDistance();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleWindowResize);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (state.mode === 'MENU') {
                earthGroup.rotation.y += 0.14 * dt;
            }

            const keySpeed = 1.9 * dt;
            let keyYaw = 0;
            let keyPitch = 0;
            if (state.keysPressed.ArrowLeft) keyYaw -= keySpeed;
            if (state.keysPressed.ArrowRight) keyYaw += keySpeed;
            if (state.keysPressed.ArrowUp) keyPitch -= keySpeed;
            if (state.keysPressed.ArrowDown) keyPitch += keySpeed;

            if (keyYaw !== 0 || keyPitch !== 0) {
                const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), keyYaw);
                const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), keyPitch);
                earthGroup.quaternion.premultiply(qY);
                earthGroup.quaternion.premultiply(qX);
            }

            if (!state.isRotating && (Math.abs(state.rotVelocity.x) > 0.05 || Math.abs(state.rotVelocity.y) > 0.05)) {
                rotateEarthByDelta(state.rotVelocity.x, state.rotVelocity.y);
                state.rotVelocity.x *= 0.91;
                state.rotVelocity.y *= 0.91;
            }

            if (state.mode === 'REVEALING' && state.optimalAnimStartTime !== null) {
                const animElapsed = performance.now() - state.optimalAnimStartTime;
                if (animElapsed >= 0) {
                    const progress = THREE.MathUtils.clamp(animElapsed / 1000, 0, 1);
                    const eased = progress < 0.5
                        ? 2 * progress * progress
                        : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    updateAnimatedOptimalPath(eased);
                }
            }

            if (state.mode !== 'MENU') {
                const pulseScale = 1 + Math.sin(elapsed * 4) * 0.18;
                markerA.userData.ring.scale.set(pulseScale, pulseScale, 1);
                markerB.userData.ring.scale.set(pulseScale, pulseScale, 1);

                earthGroup.updateMatrixWorld();
                updateCityLabelPosition(state.posA, labelAEl);
                updateCityLabelPosition(state.posB, labelBEl);
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            handleWindowResize();
            fetchGlobalGamesCount();
            animate();
        };
    </script>
</body>
</html>
